<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Cihan Vision Lead Bot</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
    .wrap{max-width:900px;margin:auto;padding:18px}.hero{background:#111827;color:white;border-radius:20px;padding:20px;margin-bottom:14px}
    .hero h1{font-size:22px;margin:0 0 7px}.hero p{margin:0;color:#d1d5db;font-size:14px}
    .panel{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
    button{width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:16px;cursor:pointer}
    #locate{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827;margin-top:10px}
    #status{font-size:14px;margin-top:12px;line-height:1.45}.muted{color:#6b7280}
    #map{height:52vh;min-height:390px;border-radius:18px;overflow:hidden}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f3f4f6;border-radius:12px;padding:10px;text-align:center}
    .stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#6b7280}
    .lead{border-top:1px solid #e5e7eb;padding:14px 0}.lead:first-child{border-top:0}.lead-title{font-weight:800}
    .badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:999px;background:#eef2ff;margin-top:5px}
    .links a{display:inline-block;margin:8px 10px 0 0;font-size:13px;color:#2563eb;text-decoration:none;font-weight:650}
    .hidden{display:none}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #d1d5db;border-top-color:#111827;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
    @keyframes s{to{transform:rotate(360deg)}} @media(max-width:600px){.wrap{padding:12px}.summary{grid-template-columns:repeat(3,1fr)}#map{height:48vh}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>CIHAN VISION — Lead Bot</h1>
    <p>Bulunduğun konumdan nitelikli işletmeleri bulur ve saha rotanı oluşturur.</p>
  </div>

  <div class="panel">
    <button id="locate">📍 Konumumu Kullan ve Rota Oluştur</button>
    <button id="manualBtn" class="secondary">Koordinatı elle gir</button>
    <div id="manual" class="hidden" style="margin-top:10px">
      <input id="coords" placeholder="41.073833, 28.904750" style="width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px">
      <button id="manualGo" class="secondary">Bu konumdan rota oluştur</button>
    </div>
    <div id="status" class="muted">Hazır.</div>
    <div id="summary" class="summary hidden"></div>
  </div>

  <div id="mapPanel" class="panel hidden"><div id="map"></div></div>
  <div id="listPanel" class="panel hidden"><div id="leadList"></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map, layerGroup;

const statusEl = document.getElementById('status');
const summaryEl = document.getElementById('summary');
const mapPanel = document.getElementById('mapPanel');
const listPanel = document.getElementById('listPanel');

function setBusy(text){
  statusEl.innerHTML = '<span class="spinner"></span>' + text;
  document.getElementById('locate').disabled = true;
}
function setReady(text){
  statusEl.textContent = text;
  document.getElementById('locate').disabled = false;
}
function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function runRoute(lat, lon){
  setBusy('İşletmeler taranıyor ve gerçek yaya rotası hesaplanıyor… Bu işlem biraz sürebilir.');
  summaryEl.classList.add('hidden');

  try{
    const res = await fetch('/api/route',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lat,lon})
    });
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || 'Rota oluşturulamadı.');

    render(data);
    setReady(`✓ Rota hazır — ${data.leads.length} işletme`);
  }catch(e){
    setReady('⚠ ' + e.message);
  }
}

function render(data){
  const leads = data.leads;
  const s = data.summary || {};

  summaryEl.innerHTML = `
    <div class="stat"><b>${leads.length}</b><span>ROTA LEADİ</span></div>
    <div class="stat"><b>${s.walk_km || '—'} km</b><span>YÜRÜYÜŞ</span></div>
    <div class="stat"><b>${s.walk_min || '—'} dk</b><span>SAF YÜRÜYÜŞ</span></div>`;
  summaryEl.classList.remove('hidden');

  mapPanel.classList.remove('hidden');
  listPanel.classList.remove('hidden');

  if(!map){
    map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19, attribution:'&copy; OpenStreetMap'
    }).addTo(map);
    layerGroup = L.layerGroup().addTo(map);
  }
  layerGroup.clearLayers();

  const points = [[data.start.lat,data.start.lon]];
  L.marker(points[0]).addTo(layerGroup).bindPopup('<b>Başlangıç</b>');

  leads.forEach((x,i)=>{
    const p=[x.lat,x.lon]; points.push(p);
    L.marker(p).addTo(layerGroup).bindPopup(`<b>${i+1}. ${esc(x.isim)}</b><br>${esc(x.sektor)}`);
  });

  L.polyline(points,{weight:4,opacity:.7}).addTo(layerGroup);
  map.fitBounds(points,{padding:[28,28]});
  setTimeout(()=>map.invalidateSize(),100);

  document.getElementById('leadList').innerHTML = leads.map((x,i)=>{
    const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.lat+','+x.lon)}`;
    const phone=x.telefon?`<a href="tel:${esc(x.telefon)}">Ara</a>`:'';
    const web=x.website?`<a href="${esc(x.website)}" target="_blank" rel="noopener">Website</a>`:'';
    return `<div class="lead">
      <div class="lead-title">${i+1}. ${esc(x.isim)}</div>
      <div class="muted">${esc(x.sektor)}</div>
      <span class="badge">${esc(x.potansiyel_etiket)} · ${esc(x.potansiyel)}/100${x.bayi?' · BAYİ ADAYI':''}</span>
      <div class="links"><a href="${maps}" target="_blank" rel="noopener">Haritada aç</a>${phone}${web}</div>
    </div>`;
  }).join('');
}

document.getElementById('locate').onclick=()=>{
  if(!navigator.geolocation){
    setReady('⚠ Bu tarayıcı konum özelliğini desteklemiyor.');
    return;
  }
  setBusy('Konum alınıyor…');
  navigator.geolocation.getCurrentPosition(
    p=>runRoute(p.coords.latitude,p.coords.longitude),
    e=>setReady('⚠ Konum alınamadı. Safari konum iznini kontrol et veya koordinatı elle gir.'),
    {enableHighAccuracy:true,timeout:15000,maximumAge:30000}
  );
};

document.getElementById('manualBtn').onclick=()=>document.getElementById('manual').classList.toggle('hidden');
document.getElementById('manualGo').onclick=()=>{
  const parts=document.getElementById('coords').value.split(',').map(x=>Number(x.trim()));
  if(parts.length!==2 || !Number.isFinite(parts[0]) || !Number.isFinite(parts[1])){
    setReady('⚠ Koordinatı 41.073833, 28.904750 şeklinde gir.');
    return;
  }
  runRoute(parts[0],parts[1]);
};
</script>
</body>
</html>
